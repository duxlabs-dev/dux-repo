# OBS Package Configuration for Dux Labs packages

schema_version: "1.0"

# Package definitions (owners: OBS owners that build it; absent = all)
packages:
  # ============================================================================
  # STABLE PACKAGES
  # ============================================================================

  cpptrace:
    type: stable
    upstream:
      repo: jeremy-rifkin/cpptrace
      source_type: github_release
    distros:
      - debian
      - opensuse
    build:
      language: cpp
      requires:
        - cmake
    tarball:
      directory_name: "cpptrace-{version}"
      compression: gz

  cli11:
    type: stable
    upstream:
      repo: CLIUtils/CLI11
      source_type: github_release
    distros:
      - opensuse
    build:
      language: cpp
      requires:
        - cmake
    tarball:
      directory_name: "CLI11-{version}"
      compression: gz

  rust187:
    type: toolchain
    upstream:
      repo: rust-lang/rust
      source_type: rust_dist
    distros:
      - debian
    build:
      language: rust-bin
      rust_version: "1.87.0"

  zig16:
    type: toolchain
    upstream:
      repo: ziglang/zig
      source_type: ziglang_dist
    distros:
      - debian
      - opensuse
    build:
      language: zig-bin
      zig_version: "0.16.0"

  zig17:
    type: toolchain
    upstream:
      repo: ziglang/zig
      source_type: ziglang_dist
    distros:
      - debian
      - opensuse
    build:
      language: zig-bin
      zig_version: "0.17.0"

  dux-search:
    owners: [duxlabs]
    replaces: danksearch
    type: stable
    upstream:
      repo: duxlabs-dev/dux-search
      source_type: github_release
    distros:
      - debian
      - opensuse
    build:
      language: go
      go_version: "1.24"
      binary_release: true
      binary_template: "dsearch-linux-{arch}.gz"
    tarball:
      directory_name: "dux-search-{version}"
      compression: gz

  dux-gop:
    owners: [duxlabs]
    replaces: dgop
    type: stable
    upstream:
      repo: duxlabs-dev/dux-gop
      source_type: github_release
      release_tarball: "dgop-{version}.tar.gz"
    distros:
      - debian
      - opensuse
    build:
      language: go
      go_version: "1.24"
      binary_release: true
      binary_template: "dgop-linux-{arch}.gz"
    tarball:
      directory_name: "dgop-{version}"
      compression: gz

  dux-calendar:
    owners: [duxlabs]
    replaces: dankcalendar
    type: stable
    upstream:
      repo: duxlabs-dev/dux-calendar
      source_type: github_release
      release_tarball: "dankcalendar-{version}.tar.gz"
    distros:
      - debian
      - opensuse
    build:
      language: go
      binary_release: true
      binary_template: "dcal-linux-{arch}.gz"
    tarball:
      directory_name: "dankcalendar-{version}"
      compression: gz

  dux-files:
    type: stable
    upstream:
      repo: duxlabs-dev/dux-files
      source_type: github_release
    distros:
      - debian
      - opensuse
    build:
      language: go
      binary_release: true
      binary_template: "dfiles-linux-{arch}.gz"
    tarball:
      directory_name: "dux-files-{version}"
      compression: gz

  dux-greeter:
    owners: [duxlabs]
    replaces: dms-greeter
    type: stable
    upstream:
      repo: duxlabs-dev/dux-greeter
      source_type: github_release
    distros:
      - debian
      - opensuse
    build:
      language: go
      # Release binaries already embed the UI; no Go build on OBS.
      binary_release: true
      binary_template: "dms-greeter-linux-{arch}.gz"
      # Must match the epoch already published for this package.
      debian_epoch: 1
    tarball:
      directory_name: "dux-greeter-{version}"
      compression: gz

  ghostty:
    type: stable
    upstream:
      repo: ghostty-org/ghostty
      source_type: custom
      url_template: "https://release.files.ghostty.org/{version}/ghostty-{version}.tar.gz"
    distros:
      - debian
      - opensuse
    build:
      language: zig
      zig_version: "0.17.0"
    tarball:
      directory_name: "ghostty-{version}"
      compression: xz
    checksums:
      verify: true
      algorithm: sha256

  matugen:
    type: stable
    upstream:
      repo: InioX/matugen
      source_type: github_release
    distros:
      - debian
      - opensuse
    build:
      language: rust
      rust_version: stable
      vendor_deps: true
    tarball:
      directory_name: "matugen-{version}"
      compression: gz
    sources:
      opensuse:
        - name: "Source0"
          type: binary
          url_template: "{release_url}/matugen-linux-x86_64.tar.gz"
        - name: "Source1"
          type: source
          directory_name: "matugen-source"

  niri:
    type: stable
    upstream:
      repo: YaLTeR/niri
      source_type: github_release
    distros:
      - debian  # OpenSUSE uses niri-git only
    build:
      language: rust
      rust_version: stable
      vendor_deps: true
    tarball:
      directory_name: "niri-v{version}"
      compression: xz
    checksums:
      verify: true
      algorithm: sha256

  quickshell:
    type: stable
    upstream:
      repo: quickshell-mirror/quickshell
      source_type: github_release
    distros:
      - debian
      - opensuse
    build:
      language: cpp
      requires:
        - cmake
        - qt6
    tarball:
      directory_name: "quickshell-source"
      compression: gz
    base_version:
      from_snapshots: true  # Check snapshots.yaml first

  matugen-snapshot:
    type: stable
    upstream:
      repo: InioX/matugen
      source_type: github_release
    distros:
      - debian
    build:
      language: rust
      rust_version: stable
      vendor_deps: true
    tarball:
      directory_name: "matugen-{version}"
      compression: gz
    base_version:
      from_snapshots: true  # Pin to debian_13 version (see snapshots.yaml)

  xwayland-satellite:
    type: stable
    upstream:
      repo: Supreeeme/xwayland-satellite
      source_type: github_release
    distros:
      - debian
      - opensuse
    build:
      language: rust
      rust_version: stable
      vendor_deps: true
    tarball:
      directory_name: "xwayland-satellite-source"
      compression: gz

  # ============================================================================
  # GIT PACKAGES (Nightly builds from latest commits)
  # ============================================================================

  niri-git:
    type: git
    upstream:
      repo: YaLTeR/niri
      branch: main
    base_version:
      from_stable: niri
    distros:
      - debian
      - opensuse
    build:
      language: rust
      rust_version: stable
      vendor_deps: true
    tarball:
      directory_name: "niri"
      compression: xz

  quickshell-git:
    type: git
    upstream:
      repo: quickshell-mirror/quickshell
      branch: master
    # Debian/Ubuntu/OBS: obs-check-updates bumps patch (+1) after resolving base so -git sorts above stable quickshell (see bump_patch_triplet).
    base_version:
      from_snapshots: true  # Check snapshots.yaml for quickshell stable commit
      from_stable: quickshell
    distros:
      - debian
      - opensuse
    build:
      language: cpp
      requires:
        - cmake
        - qt6
    tarball:
      directory_name: "quickshell-source"
      compression: gz
    cmake_flags:
      - "-DGIT_REVISION={commit_hash}"

  xwayland-satellite-git:
    type: git
    upstream:
      repo: Supreeeme/xwayland-satellite
      branch: main
    base_version:
      from_stable: xwayland-satellite
    distros:
      - debian
      - opensuse
    build:
      language: rust
      rust_version: stable
      vendor_deps: true
    tarball:
      directory_name: "xwayland-satellite-source"
      compression: gz

  dux-calendar-git:
    owners: [duxlabs]
    replaces: dankcalendar-git
    type: git
    upstream:
      repo: duxlabs-dev/dux-calendar
      branch: master
    base_version:
      from_stable: dux-calendar
    distros:
      - debian
      - opensuse
    build:
      language: go
      go_version: "1.25"
      vendor_deps: true
      bundle_go_toolchain: true
    tarball:
      directory_name: "dux-calendar"
      compression: gz

  dux-files-git:
    type: git
    upstream:
      repo: duxlabs-dev/dux-files
      branch: master
    base_version:
      from_stable: dux-files
      # Used until dux-files has its first release
      fallback: "0.0.0"
    distros:
      - debian
      - opensuse
    build:
      language: go
      go_version: "1.27"
      vendor_deps: true
      bundle_go_toolchain: true
    tarball:
      directory_name: "dux-files"
      compression: gz

  dux-greeter-git:
    owners: [duxlabs]
    replaces: dms-greeter-git
    type: git
    upstream:
      repo: duxlabs-dev/dux-greeter
      branch: master
    base_version:
      from_stable: dux-greeter
      fallback: "1.0.0"
    distros:
      - debian
      - opensuse
    build:
      language: go
      go_version: "1.27"
      vendor_deps: true
      bundle_go_toolchain: true
      debian_epoch: 1
    tarball:
      directory_name: "dux-greeter-git-source"
      compression: gz

  # ============================================================================
  # LEGACY NAMES (home:AvengeMedia:danklinux only)
  # ============================================================================

  danksearch:
    owners: [avengemedia]
    type: stable
    upstream:
      repo: duxlabs-dev/dux-search
      source_type: github_release
    distros:
      - debian
      - opensuse
    build:
      language: go
      go_version: "1.24"
      binary_release: true
      binary_template: "dsearch-linux-{arch}.gz"
    tarball:
      directory_name: "danksearch-{version}"
      compression: gz

  dgop:
    owners: [avengemedia]
    type: stable
    upstream:
      repo: duxlabs-dev/dux-gop
      source_type: github_release
    distros:
      - debian
      - opensuse
    build:
      language: go
      go_version: "1.24"
      binary_release: true
    tarball:
      directory_name: "dgop-{version}"
      compression: gz

  dankcalendar:
    owners: [avengemedia]
    type: stable
    upstream:
      repo: duxlabs-dev/dux-calendar
      source_type: github_release
    distros:
      - debian
      - opensuse
    build:
      language: go
      binary_release: true
      binary_template: "dcal-linux-{arch}.gz"
    tarball:
      directory_name: "dankcalendar-{version}"
      compression: gz

  dms-greeter:
    owners: [avengemedia]
    type: stable
    upstream:
      repo: duxlabs-dev/dux-greeter
      source_type: github_release
    distros:
      - debian
      - opensuse
    build:
      language: go
      # Release binaries already embed the UI; no Go build on OBS.
      binary_release: true
      # Must match the epoch already published for this package.
      debian_epoch: 1
    tarball:
      directory_name: "dms-greeter-{version}"
      compression: gz

  dankcalendar-git:
    owners: [avengemedia]
    type: git
    upstream:
      repo: duxlabs-dev/dux-calendar
      branch: master
    base_version:
      from_stable: dankcalendar
    distros:
      - debian
      - opensuse
    build:
      language: go
      go_version: "1.25"
      vendor_deps: true
      bundle_go_toolchain: true
    tarball:
      directory_name: "dankcalendar"
      compression: gz

  dms-greeter-git:
    owners: [avengemedia]
    type: git
    upstream:
      repo: duxlabs-dev/dux-greeter
      branch: master
    base_version:
      from_stable: dms-greeter
      fallback: "1.0.0"
    distros:
      - debian
      - opensuse
    build:
      language: go
      go_version: "1.27"
      vendor_deps: true
      bundle_go_toolchain: true
      debian_epoch: 1
    tarball:
      directory_name: "dms-greeter-git-source"
      compression: gz

# ============================================================================
# BUILD SYSTEM DEFAULTS
# ============================================================================

defaults:
  # API retry configuration
  retry:
    api_calls: 3
    backoff_seconds: [2, 4, 8]

  # Temporary directory template
  temp_dir: /tmp/obs-build-$$

  # Cache TTL (seconds)
  cache_ttl: 900  # 15 minutes

  # Default tarball options for reproducible builds
  tarball:
    options: "--sort=name --mtime=2000-01-01 --owner=0 --group=0"
    compression: gz

  # OBS project configuration
  obs:
    project: "home:AvengeMedia:danklinux"
    repositories:
      - "Debian_13"
      - "openSUSE_Tumbleweed"
      - "openSUSE_Slowroll"
      - "16.0"
    architectures:
      - "x86_64"
      - "aarch64"

  # Version prefix configuration
  version:
    initial_db_suffix: 1
    debian_format: "{base}.db{suffix}"
    opensuse_release_format: "{suffix}%{{?dist}}"

# ============================================================================
# PACKAGE GROUPS
# ============================================================================

# Groups use current names; an owner without a member builds the package it `replaces`.
groups:
  all-stable:
    - dux-search
    - dux-calendar
    - dux-files
    - dux-greeter
    - dux-gop
    - ghostty
    - matugen
    - matugen-snapshot
    - niri
    - quickshell
    - cpptrace
    - xwayland-satellite

  all-git:
    - niri-git
    - quickshell-git
    - xwayland-satellite-git
    - dux-calendar-git
    - dux-files-git
    - dux-greeter-git

  all:
    - dux-search
    - dux-calendar
    - dux-files
    - dux-greeter
    - dux-gop
    - ghostty
    - matugen
    - matugen-snapshot
    - niri
    - niri-git
    - quickshell
    - quickshell-git
    - cpptrace
    - xwayland-satellite
    - xwayland-satellite-git
    - dux-calendar-git
    - dux-files-git
    - dux-greeter-git

  debian-only:
    - niri  # niri stable is Debian-only; OpenSUSE uses niri-git
    - matugen-snapshot
    - rust187

  opensuse-only:
    - cli11

  rust-packages:
    - matugen
    - matugen-snapshot
    - niri
    - niri-git
    - xwayland-satellite
    - xwayland-satellite-git

  go-packages:
    - dux-search
    - dux-calendar
    - dux-files
    - dux-gop
    - dux-calendar-git
    - dux-files-git
    - dux-greeter
    - dux-greeter-git

  cpp-packages:
    - quickshell
    - quickshell-git
    - cpptrace
    - cli11

  binary-releases:
    - dux-search
    - dux-calendar
    - dux-files
    - dux-greeter
    - dux-gop
