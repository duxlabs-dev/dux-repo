name: Void Linux XBPS Repository

# LEGACY_MIRROR: dms/current is shared with dux-shell; publish-void-r2.sh ETag-guards it.

on:
  schedule:
    - cron: "0 */6 * * *" # Every 6 hours (00:00, 06:00, 12:00, 18:00 UTC)
  repository_dispatch:
    types: [greeter-git, greeter-release]
  workflow_dispatch:
    inputs:
      package:
        description: 'Package to build'
        type: choice
        required: false
        options:
          - all
          - dux-calendar
          - dux-search
          - dux-gop
          - dux-files
          - dux-greeter
          - dux-greeter-git
        default: 'all'
      force_rebuild:
        description: 'Force rebuilding packages even if they already exist in the repository'
        type: boolean
        required: false
        default: false

permissions:
  contents: read

concurrency:
  group: void-xbps-${{ github.ref }}
  cancel-in-progress: false

env:
  # Freeze two weeks after `dms migrate dux` ships: set to "false".
  LEGACY_MIRROR: "true"

jobs:
  build-and-deploy:
    name: Build & Deploy XBPS packages
    runs-on: ubuntu-latest
    if: github.repository_owner == 'duxlabs-dev'
    env:
      AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      AWS_DEFAULT_REGION: auto
      AWS_EC2_METADATA_DISABLED: true
      R2_BUCKET: danklinux-void
      R2_ENDPOINT: https://${{ secrets.CLOUDFLARE_ACCOUNT_ID }}.r2.cloudflarestorage.com
      R2_PREFIX: dux-repo
      REPOSITORY_DIR: ${{ github.workspace }}/r2-repo
      GREETER_SRC: ${{ github.workspace }}/greeter-src
      GITHUB_TOKEN: ${{ github.token }}
      SOURCE_COMMIT: ${{ github.sha }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Record checked-out source commit
        run: echo "SOURCE_COMMIT=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Determine packages
        id: plan
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_TYPE: ${{ github.event.action }}
          SELECTED: ${{ github.event.inputs.package || 'all' }}
        run: |
          case "$EVENT_NAME" in
            repository_dispatch)
              case "$DISPATCH_TYPE" in
                greeter-git)     PACKAGES="dux-greeter-git" ;;
                greeter-release) PACKAGES="dux-greeter" ;;
                *) echo "Unknown dispatch type: $DISPATCH_TYPE" >&2; exit 1 ;;
              esac
              ;;
            *)
              if [ "$SELECTED" = "all" ]; then
                # Transitional old-name metas last: xbps-src needs their targets built first.
                PACKAGES="dux-gop dux-search dux-calendar dux-files dux-greeter-git dux-greeter dgop danksearch dankcalendar dms-greeter-git dms-greeter"
              else
                PACKAGES="$SELECTED"
              fi
              ;;
          esac
          case " $PACKAGES " in
            *" dux-greeter"*) GREETER=true ;;
            *) GREETER=false ;;
          esac
          LEGACY=()
          for pkg in $PACKAGES; do
            case "$pkg" in
              dux-gop) LEGACY+=(dgop) ;;
              dux-search) LEGACY+=(danksearch) ;;
              dux-calendar) LEGACY+=(dankcalendar) ;;
              dux-greeter-git) LEGACY+=(dms-greeter-git) ;;
              dux-greeter) LEGACY+=(dms-greeter) ;;
            esac
          done
          echo "packages=$PACKAGES" >> "$GITHUB_OUTPUT"
          echo "greeter=$GREETER" >> "$GITHUB_OUTPUT"
          echo "legacy=${LEGACY[*]}" >> "$GITHUB_OUTPUT"
          echo "Packages to build: $PACKAGES"
          echo "Legacy packages:   ${LEGACY[*]}"

      - name: Clone dux-greeter
        if: steps.plan.outputs.greeter == 'true'
        # A failed clone fails only the greeter builds, below.
        continue-on-error: true
        run: |
          # Full history: the snapshot version embeds the commit count.
          git clone --recurse-submodules https://github.com/duxlabs-dev/dux-greeter.git "$GREETER_SRC"
          git -C "$GREETER_SRC" log -1 --oneline

      - name: Download current R2 repository
        run: |
          aws --version
          bash .github/scripts/publish-void-r2.sh download

      - name: Install XBPS Static Utilities
        run: |
          mkdir -p ${{ github.workspace }}/xbps
          curl -s -L https://repo-default.voidlinux.org/static/xbps-static-latest.x86_64-musl.tar.xz | tar -xJ -C ${{ github.workspace }}/xbps
          echo "${{ github.workspace }}/xbps/usr/bin" >> $GITHUB_PATH

      - name: Clone void-packages
        run: |
          git clone --depth=1 https://github.com/void-linux/void-packages.git

      - name: Inject templates
        run: |
          cp -R distro/void/srcpkgs/* void-packages/srcpkgs/

      - name: Enable unprivileged user namespaces (Ubuntu 24.04)
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 || true

      - name: Bootstrap xbps-src
        run: |
          cd void-packages
          ./xbps-src binary-bootstrap

      - name: Configure signing keys and trust
        run: |
          echo "${{ secrets.XBPS_PRIVATE_KEY }}" > /tmp/xbps_privkey.pem
          chmod 600 /tmp/xbps_privkey.pem

          openssl rsa -in /tmp/xbps_privkey.pem -pubout -out /tmp/dms-key.pub
          rm -f /tmp/xbps_privkey.pem

          sudo mkdir -p /var/db/xbps/keys
          sudo cp /tmp/dms-key.pub /var/db/xbps/keys/dms-key.pub

          mkdir -p void-packages/masterdir/var/db/xbps/keys
          cp /tmp/dms-key.pub void-packages/masterdir/var/db/xbps/keys/dms-key.pub
          rm -f /tmp/dms-key.pub

      - name: Configure repositories
        run: |
          # Seed the build cache with published packages to avoid rebuilds
          if [ -d "$REPOSITORY_DIR/current" ]; then
            mkdir -p void-packages/hostdir/binpkgs
            cp -L "$REPOSITORY_DIR"/current/*.xbps void-packages/hostdir/binpkgs/ 2>/dev/null || true
            xbps-rindex -a void-packages/hostdir/binpkgs/*.xbps 2>/dev/null || true
          fi

      - name: Build packages
        id: build
        env:
          VOID_PACKAGES_DIR: ${{ github.workspace }}/void-packages
          PACKAGES: ${{ steps.plan.outputs.packages }}
          FORCE_REBUILD: ${{ github.event.inputs.force_rebuild || 'false' }}
        run: |
          mkdir -p "$REPOSITORY_DIR/current"
          FORCE_ARGS=()
          if [ "$FORCE_REBUILD" = "true" ]; then
            FORCE_ARGS+=(--force)
          fi

          echo "=== Starting Builds ==="
          echo "Force rebuild:        $FORCE_REBUILD"
          echo "Packages:             $PACKAGES"

          # errexit is off inside `if` conditions, so each command is chained with &&.
          build_one() {
            local pkg="$1" ver rev file
            case "$pkg" in
              dux-greeter|dux-greeter-git)
                bash distro/scripts/void/void-build.sh "$pkg" \
                  --source-dir="$GREETER_SRC" "${FORCE_ARGS[@]}"
                return
                ;;
            esac
            ver=$(grep -E '^version=' "$VOID_PACKAGES_DIR/srcpkgs/$pkg/template" | cut -d= -f2 | tr -d '"') &&
            rev=$(grep -E '^revision=' "$VOID_PACKAGES_DIR/srcpkgs/$pkg/template" | cut -d= -f2 | tr -d '"') &&
            file="${pkg}-${ver}_${rev}.x86_64.xbps" || return 1
            if [ -f "$REPOSITORY_DIR/current/$file" ] && [ "$FORCE_REBUILD" != "true" ]; then
              echo "✅ $file already exists, skipping build."
              return 0
            fi
            echo "🔨 Compiling $pkg ($ver)..."
            (cd "$VOID_PACKAGES_DIR" && ./xbps-src pkg "$pkg") &&
            rm -f "$REPOSITORY_DIR/current/$file" &&
            cp -L "$VOID_PACKAGES_DIR/hostdir/binpkgs/$file" "$REPOSITORY_DIR/current/"
          }

          FAILED=()
          for pkg in $PACKAGES; do
            echo "=========================================="
            echo "Building $pkg"
            echo "=========================================="
            if ! build_one "$pkg"; then
              echo "::error::$pkg failed to build"
              FAILED+=("$pkg")
            fi
          done
          echo "failed=${FAILED[*]}" >> "$GITHUB_OUTPUT"

          # Also re-indexes objects a previous run uploaded but never indexed.
          if bash .github/scripts/publish-void-r2.sh is-indexed; then
            echo "publish=false" >> "$GITHUB_OUTPUT"
            echo "Every package is indexed; skipping index and publish."
          else
            echo "publish=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Index and sign repository
        if: steps.build.outputs.publish == 'true'
        env:
          XBPS_PRIVATE_KEY: ${{ secrets.XBPS_PRIVATE_KEY }}
        run: bash .github/scripts/publish-void-r2.sh index

      - name: Publish repository to R2
        if: steps.build.outputs.publish == 'true'
        run: bash .github/scripts/publish-void-r2.sh publish

      - name: Build legacy packages
        id: legacy
        if: env.LEGACY_MIRROR == 'true' && steps.plan.outputs.legacy != ''
        env:
          VOID_PACKAGES_DIR: ${{ github.workspace }}/void-packages
          PACKAGES: ${{ steps.plan.outputs.legacy }}
          FORCE_REBUILD: ${{ github.event.inputs.force_rebuild || 'false' }}
          REPOSITORY_DIR: ${{ github.workspace }}/r2-legacy
          TEMPLATE_ROOT: ${{ github.workspace }}/distro/void/legacy/srcpkgs
        run: |
          mkdir -p "$REPOSITORY_DIR/current"
          # Already-published legacy objects, so the skip checks see them; the mirror never re-uploads them.
          aws --endpoint-url "$R2_ENDPOINT" s3 sync "s3://$R2_BUCKET/danklinux/current/" "$REPOSITORY_DIR/current/" \
            --exclude '*' --include 'dgop-*.xbps' --include 'danksearch-*.xbps' --include 'dankcalendar-*.xbps' --only-show-errors
          aws --endpoint-url "$R2_ENDPOINT" s3 sync "s3://$R2_BUCKET/dms/current/" "$REPOSITORY_DIR/current/" \
            --exclude '*' --include 'dms-greeter-*.xbps' --only-show-errors

          FORCE_ARGS=()
          if [ "$FORCE_REBUILD" = "true" ]; then
            FORCE_ARGS+=(--force)
          fi

          build_one() {
            local pkg="$1" ver rev file
            # Same names as the transitional metas, which were built and copied out above.
            rm -rf "$VOID_PACKAGES_DIR/srcpkgs/$pkg" &&
            cp -R "$TEMPLATE_ROOT/$pkg" "$VOID_PACKAGES_DIR/srcpkgs/" || return 1
            case "$pkg" in
              dms-greeter|dms-greeter-git)
                bash distro/scripts/void/void-build.sh "$pkg" \
                  --source-dir="$GREETER_SRC" "${FORCE_ARGS[@]}"
                return
                ;;
            esac
            ver=$(grep -E '^version=' "$VOID_PACKAGES_DIR/srcpkgs/$pkg/template" | cut -d= -f2 | tr -d '"') &&
            rev=$(grep -E '^revision=' "$VOID_PACKAGES_DIR/srcpkgs/$pkg/template" | cut -d= -f2 | tr -d '"') &&
            file="${pkg}-${ver}_${rev}.x86_64.xbps" || return 1
            if [ -f "$REPOSITORY_DIR/current/$file" ] && [ "$FORCE_REBUILD" != "true" ]; then
              echo "✅ $file already exists, skipping build."
              return 0
            fi
            echo "🔨 Compiling legacy $pkg ($ver)..."
            (cd "$VOID_PACKAGES_DIR" && ./xbps-src pkg "$pkg") &&
            rm -f "$REPOSITORY_DIR/current/$file" &&
            cp -L "$VOID_PACKAGES_DIR/hostdir/binpkgs/$file" "$REPOSITORY_DIR/current/"
          }

          FAILED=()
          for pkg in $PACKAGES; do
            echo "=========================================="
            echo "Building legacy $pkg"
            echo "=========================================="
            if ! build_one "$pkg"; then
              echo "::error::legacy $pkg failed to build"
              FAILED+=("$pkg")
            fi
          done
          echo "failed=${FAILED[*]}" >> "$GITHUB_OUTPUT"

      - name: Mirror into legacy prefixes
        if: env.LEGACY_MIRROR == 'true'
        env:
          XBPS_PRIVATE_KEY: ${{ secrets.XBPS_PRIVATE_KEY }}
          NEW_REPOSITORY_DIR: ${{ github.workspace }}/r2-repo
          LEGACY_REPOSITORY_DIR: ${{ github.workspace }}/r2-legacy
        run: |
          shopt -s nullglob
          for legacy in danklinux dms; do
            export R2_PREFIX="$legacy" REPOSITORY_DIR="${{ github.workspace }}/r2-legacy-$legacy"
            bash .github/scripts/publish-void-r2.sh download

            for pkg in "$LEGACY_REPOSITORY_DIR"/current/{dgop,danksearch,dankcalendar,dms-greeter}-*.xbps \
                       "$NEW_REPOSITORY_DIR"/current/dux-files-*.xbps; do
              name="$(basename "$pkg")"
              case "$name" in
                dms-greeter-*) target=dms ;;
                *) target=danklinux ;;
              esac
              # Never replace a legacy object: a rebuilt pkgver is not byte-identical.
              if [ "$target" = "$legacy" ] && [ ! -e "$REPOSITORY_DIR/current/$name" ]; then
                cp "$pkg" "$REPOSITORY_DIR/current/"
              fi
            done

            if bash .github/scripts/publish-void-r2.sh is-indexed; then
              echo "$legacy/current is up to date."
              continue
            fi
            bash .github/scripts/publish-void-r2.sh index
            bash .github/scripts/publish-void-r2.sh publish
          done

      - name: Fail on package build errors
        if: always() && (steps.build.outputs.failed != '' || steps.legacy.outputs.failed != '')
        env:
          FAILED: ${{ steps.build.outputs.failed }}
          LEGACY_FAILED: ${{ steps.legacy.outputs.failed }}
        run: |
          echo "::error::Failed to build: ${FAILED:-none}; legacy: ${LEGACY_FAILED:-none}"
          exit 1
