name: Update PPA Packages

on:
  workflow_dispatch:
    inputs:
      package:
        description: 'Package to upload'
        required: false
        type: choice
        options:
          - auto
          - all
          - dux-calendar
          - dux-calendar-git
          - dux-files
          - dux-files-git
          - dux-gop
          - dux-greeter
          - dux-greeter-git
          - dux-search
          - ghostty
          - matugen
          - niri
          - niri-git
          - quickshell
          - quickshell-git
          - xwayland-satellite
          - xwayland-satellite-git
        default: 'auto'
      rebuild_release:
        description: 'Release number for rebuilds (e.g., 2, 3, 4 for ppa2, ppa3, ppa4)'
        required: false
        default: ''
      owners:
        description: 'PPA owners to publish to'
        required: false
        type: choice
        options:
          - all
          - duxlabs
          - avengemedia
        default: all
  schedule:
    - cron: '0 */6 * * *'  # Every 6 hours (00:00, 06:00, 12:00, 18:00 UTC)
  # From dux-greeter notify-packaging.yml
  repository_dispatch:
    types: [greeter-git, greeter-release]

# One planner at a time; Launchpad rejects duplicate versions.
concurrency:
  group: ppa-update
  cancel-in-progress: false

jobs:
  check-updates:
    name: Check package/series updates
    runs-on: ubuntu-latest
    if: github.repository_owner == 'duxlabs-dev'

    outputs:
      has_updates: ${{ steps.check.outputs.has_updates }}
      targets: ${{ steps.check.outputs.targets }}
      targets_json: ${{ steps.check.outputs.targets_json }}

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y jq curl git dpkg-dev
          sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq

      - name: Check for updates
        id: check
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EVENT_NAME: ${{ github.event_name }}
          DISPATCH_TYPE: ${{ github.event.action }}
          OWNERS: ${{ inputs.owners || 'all' }}
        run: |
          chmod +x distro/scripts/ppa/*.sh distro/scripts/common/*.sh

          PACKAGE="${{ github.event.inputs.package }}"
          REBUILD_RELEASE="${{ github.event.inputs.rebuild_release }}"

          if [[ "$EVENT_NAME" == "repository_dispatch" ]]; then
            # Narrow a greeter dispatch to the package that changed
            case "$DISPATCH_TYPE" in
              greeter-git) PACKAGE="dux-greeter-git" ;;
              greeter-release) PACKAGE="dux-greeter" ;;
              *) echo "Unknown repository_dispatch type: $DISPATCH_TYPE" >&2; exit 1 ;;
            esac
            REBUILD_RELEASE=""
          fi

          if [[ -z "$PACKAGE" ]]; then
            PACKAGE="auto"
          fi

          ARGS=(--package "$PACKAGE" --json)
          if [[ -n "$REBUILD_RELEASE" ]]; then
            ARGS+=(--rebuild "$REBUILD_RELEASE")
          fi

          LEGS=$(jq -cn --arg o "$OWNERS" '[
              {owner: "duxlabs", suffix: "", ppa: "dux-repo"},
              {owner: "avengemedia", suffix: "_LEGACY", ppa: "danklinux"}
            ] | map(select($o == "all" or .owner == $o))
            | if length == 0 then error("unknown owner: \($o)") else . end')

          # Planned per owner: an empty new PPA needs everything, the old one may need nothing
          TARGETS_JSON='[]'
          : > ppa-audit.log
          while read -r LEG; do
            OWNER=$(jq -r .owner <<< "$LEG")
            PPA=$(jq -r .ppa <<< "$LEG")
            echo "~$OWNER/$PPA:" >> ppa-audit.log
            PLAN=$(PPA_OWNER="$OWNER" PPA_NAME="$PPA" distro/scripts/ppa/ppa-sync-plan.sh "${ARGS[@]}" 2>> ppa-audit.log)
            TARGETS_JSON=$(jq -c --argjson leg "$LEG" --argjson p "$PLAN" '. + [$p[] | $leg + {target: .}]' <<< "$TARGETS_JSON")
          done < <(jq -c '.[]' <<< "$LEGS")
          cat ppa-audit.log

          TARGETS=$(jq -r 'map(.owner + ":" + .target) | join(" ")' <<< "$TARGETS_JSON")
          if [[ "$TARGETS_JSON" != "[]" ]]; then
            echo "has_updates=true" >> "$GITHUB_OUTPUT"
            echo "targets=$TARGETS" >> "$GITHUB_OUTPUT"
            echo "targets_json=$TARGETS_JSON" >> "$GITHUB_OUTPUT"
            echo "Package/series targets: $TARGETS"
          else
            echo "has_updates=false" >> "$GITHUB_OUTPUT"
            echo "targets=" >> "$GITHUB_OUTPUT"
            echo "targets_json=[]" >> "$GITHUB_OUTPUT"
            echo "No package/series uploads needed"
          fi

  upload-ppa:
    name: Upload ${{ matrix.owner }} ${{ matrix.target }}
    needs: check-updates
    runs-on: ubuntu-latest
    if: github.repository_owner == 'duxlabs-dev' && needs.check-updates.outputs.has_updates == 'true'
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.check-updates.outputs.targets_json) }}
    concurrency:
      group: ppa-danklinux-${{ matrix.owner }}-${{ matrix.target }}
      cancel-in-progress: false

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            debhelper \
            devscripts \
            dput \
            lftp \
            build-essential \
            fakeroot \
            dpkg-dev \
            openssh-client \
            jq \
            curl \
            git
          sudo wget -qO /usr/local/bin/yq https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64
          sudo chmod +x /usr/local/bin/yq

      - name: Configure GPG
        env:
          GPG_KEY: ${{ secrets[format('GPG_PRIVATE_KEY{0}', matrix.suffix)] }}
        run: |
          : "${GPG_KEY:?GPG_PRIVATE_KEY${{ matrix.suffix }} secret not set}"
          echo "$GPG_KEY" | gpg --import
          GPG_KEY_ID=$(gpg --list-secret-keys --keyid-format LONG | grep sec | awk '{print $2}' | cut -d'/' -f2)
          echo "DEBSIGN_KEYID=$GPG_KEY_ID" >> "$GITHUB_ENV"

      - name: Upload target
        env:
          TARGET: ${{ matrix.target }}
          PPA_OWNER: ${{ matrix.owner }}
          PPA_NAME: ${{ matrix.ppa }}
          LAUNCHPAD_SSH_PRIVATE_KEY: ${{ secrets[format('LAUNCHPAD_SSH_PRIVATE_KEY{0}', matrix.suffix)] }}
          LAUNCHPAD_SSH_LOGIN: ${{ secrets[format('LAUNCHPAD_SSH_LOGIN{0}', matrix.suffix)] }}
        run: |
          : "${LAUNCHPAD_SSH_PRIVATE_KEY:?LAUNCHPAD_SSH_PRIVATE_KEY${{ matrix.suffix }} secret not set}"
          : "${LAUNCHPAD_SSH_LOGIN:?LAUNCHPAD_SSH_LOGIN${{ matrix.suffix }} secret not set}"
          IFS=':' read -r PACKAGE UBUNTU_SERIES PPA_NUM <<< "$TARGET"

          echo "Uploading $PACKAGE to ~$PPA_OWNER/$PPA_NAME $UBUNTU_SERIES with ppa$PPA_NUM"
          bash distro/scripts/ppa/ppa-upload.sh "$PACKAGE" "$PPA_NAME" "$UBUNTU_SERIES" "$PPA_NUM"

      - name: Summary
        if: always()
        run: |
          echo "### PPA Package Upload" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Owner:** ${{ matrix.owner }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **Target:** ${{ matrix.target }}" >> "$GITHUB_STEP_SUMMARY"
          echo "- **PPA:** https://launchpad.net/~${{ matrix.owner }}/+archive/ubuntu/${{ matrix.ppa }}/+packages" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "Launchpad build state is checked separately after upload." >> "$GITHUB_STEP_SUMMARY"
